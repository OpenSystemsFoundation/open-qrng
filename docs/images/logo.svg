<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 128 128"
    role="img"
    aria-labelledby="t"
>
  <title id="t">QuantumFair</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00579f" />
      <stop offset="1" stop-color="#0070c9" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <!-- z axis -->
    <path d="M64 20v88" stroke-width="2" opacity=".35" stroke-dasharray="2 5" />
    <!-- equator: back half dashed, front half solid -->
    <path
            d="M24 64a40 12 0 0 1 80 0"
            stroke-width="2.5"
            opacity=".45"
            stroke-dasharray="3 5"
        />
    <path d="M24 64a40 12 0 0 0 80 0" stroke-width="3" opacity=".9" />
    <!-- sphere -->
    <circle cx="64" cy="64" r="40" stroke-width="4.5" />
    <!-- state vector -->
    <path d="M64 64 91 34" stroke-width="5" />
  </g>
  <circle cx="64" cy="64" r="4" fill="#fff" />
  <circle
        cx="91"
        cy="34"
        r="7.5"
        fill="#a4c9ff"
        stroke="#fff"
        stroke-width="3"
    />
</svg>
