<template>
    <lightning-card
        title="Job Monitor"
        icon-name="standard:process"
    >
        <div class="slds-p-around_medium">
            <template if:true={job}>
                <div
                    class="slds-grid slds-gutters slds-m-bottom_medium"
                >
                    <div class="slds-col slds-size_1-of-2">
                        <dl class="slds-dl_horizontal">
                            <dt
                                class="slds-dl_horizontal__label"
                            >
                                Job:
                            </dt>
                            <dd
                                class="slds-dl_horizontal__detail"
                            >
                                <button
                                    class="slds-button slds-button_reset slds-text-link"
                                    onclick={handleNavigateToJob}
                                >
                                    {job.name}
                                </button>
                            </dd>
                            <dt
                                class="slds-dl_horizontal__label"
                            >
                                Backend:
                            </dt>
                            <dd
                                class="slds-dl_horizontal__detail"
                            >
                                {job.backend}
                            </dd>
                            <dt
                                class="slds-dl_horizontal__label"
                            >
                                Qubits:
                            </dt>
                            <dd
                                class="slds-dl_horizontal__detail"
                            >
                                {job.numQubits}
                            </dd>
                            <dt
                                class="slds-dl_horizontal__label"
                            >
                                Shots:
                            </dt>
                            <dd
                                class="slds-dl_horizontal__detail"
                            >
                                {job.shots}
                            </dd>
                        </dl>
                    </div>
                    <div
                        class="slds-col slds-size_1-of-2 slds-text-align_center"
                    >
                        <div
                            class={statusClass}
                            data-testid="job-status-badge"
                        >
                            <p class="status-label">
                                {job.status}
                            </p>
                        </div>
                        <template if:true={isInProgress}>
                            <p
                                class="slds-m-top_small slds-text-body_small pulse"
                            >
                                Awaiting result...
                            </p>
                        </template>
                    </div>
                </div>

                <!-- Progress path -->
                <lightning-progress-indicator
                    current-step={currentStep}
                    type="path"
                    class="slds-m-bottom_medium"
                >
                    <lightning-progress-step
                        label="Submitted"
                        value="Submitted"
                    ></lightning-progress-step>
                    <lightning-progress-step
                        label="Queued"
                        value="Queued"
                    ></lightning-progress-step>
                    <lightning-progress-step
                        label="Running"
                        value="Running"
                    ></lightning-progress-step>
                    <lightning-progress-step
                        label="Completed"
                        value="Completed"
                    ></lightning-progress-step>
                </lightning-progress-indicator>

                <!-- Error message -->
                <template if:true={job.errorMessage}>
                    <div
                        class="slds-notify slds-notify_alert slds-alert_error slds-m-top_small"
                        role="alert"
                    >
                        <p>{job.errorMessage}</p>
                    </div>
                </template>

                <!-- Results section -->
                <template if:true={isCompleted}>
                    <div class="slds-m-top_medium">
                        <template if:true={certificateId}>
                            <c-qrng-fairness-certificate
                                certificate-id={certificateId}
                            ></c-qrng-fairness-certificate>
                        </template>
                    </div>
                </template>
            </template>

            <!-- Wire error -->
            <template if:true={wireError}>
                <div
                    class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-p-around_small slds-m-top_small"
                    role="status"
                    data-testid="job-monitor-error"
                >
                    <div class="slds-media__body">
                        <p>
                            Could not load job status:
                            {wireError}
                        </p>
                    </div>
                </div>
            </template>

            <template if:false={job}>
                <template if:false={wireError}>
                    <div
                        class="slds-illustration slds-illustration_small slds-text-align_center"
                    >
                        <p class="slds-text-body_regular">
                            No active job. Submit a quantum
                            circuit to get started.
                        </p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
