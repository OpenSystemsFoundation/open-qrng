<template>
    <lightning-card title="Measurement Distribution" icon-name="standard:report">
        <div class="slds-p-around_small">
            <div class="canvas-container" lwc:ref="chartContainer">
                <canvas lwc:ref="chartCanvas"></canvas>
            </div>
            <template if:true={hasData}>
                <div class="slds-grid slds-m-top_small slds-text-body_small">
                    <div class="slds-col">Total samples: {totalSamples}</div>
                    <div class="slds-col slds-text-align_right">Unique bitstrings: {uniqueCount}</div>
                </div>
            </template>
            <template if:false={hasData}>
                <div class="slds-text-align_center slds-p-around_medium slds-text-color_weak">
                    No measurement data available
                </div>
            </template>
        </div>
    </lightning-card>
</template>
