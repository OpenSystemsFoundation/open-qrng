<template>
    <lightning-card
        title="Measurement Distribution"
        icon-name="standard:report"
    >
        <div class="slds-p-around_small">
            <!-- Raw Results Chart -->
            <h3 class="chart-section-title">Raw Results</h3>
            <p class="chart-section-desc">
                Distribution of bitstrings as measured from
                the quantum processor, before any
                post-processing.
            </p>
            <div
                class="canvas-container"
                lwc:ref="chartContainer"
            >
                <canvas
                    lwc:ref="chartCanvas"
                    role="img"
                    aria-label="Bar chart of raw measurement bitstring distribution"
                    data-testid="results-chart"
                ></canvas>
            </div>
            <template if:true={hasData}>
                <div
                    class="slds-grid slds-m-top_small slds-m-bottom_medium slds-text-body_small"
                >
                    <div class="slds-col">
                        Total samples: {totalSamples}
                    </div>
                    <div
                        class="slds-col slds-text-align_right"
                    >
                        Unique bitstrings: {uniqueCount} /
                        {possibleCount}
                    </div>
                </div>
            </template>

            <!-- Debiased Results Chart -->
            <template if:true={hasDebiasedData}>
                <h3
                    class="chart-section-title slds-m-top_medium"
                >
                    Debiased Results (von Neumann)
                </h3>
                <p class="chart-section-desc">
                    Post-processed using von Neumann
                    debiasing to remove hardware bias. This
                    is the data used for fairness
                    certification.
                </p>
                <div
                    class="canvas-container"
                    lwc:ref="debiasedContainer"
                >
                    <canvas
                        lwc:ref="debiasedCanvas"
                        role="img"
                        aria-label="Bar chart of debiased measurement bitstring distribution"
                    ></canvas>
                </div>
                <div
                    class="slds-grid slds-m-top_small slds-text-body_small"
                >
                    <div class="slds-col">
                        Total samples:
                        {debiasedTotalSamples}
                    </div>
                    <div
                        class="slds-col slds-text-align_right"
                    >
                        Unique bitstrings:
                        {debiasedUniqueCount} /
                        {possibleCount}
                    </div>
                </div>
            </template>

            <template if:false={hasData}>
                <div
                    class="slds-text-align_center slds-p-around_medium slds-text-color_weak"
                >
                    No measurement data available
                </div>
            </template>
        </div>
    </lightning-card>
</template>
