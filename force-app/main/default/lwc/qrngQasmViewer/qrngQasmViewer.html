<template>
    <template if:true={hasQasm}>
        <template if:true={hasMultipleCircuits}>
            <div
                class="slds-grid slds-grid_align-center slds-grid_vertical-align-center slds-m-bottom_small"
            >
                <lightning-button-icon
                    icon-name="utility:chevronleft"
                    alternative-text="Previous circuit"
                    onclick={handlePrev}
                    disabled={isPrevDisabled}
                    variant="border-filled"
                    class="slds-m-right_small"
                ></lightning-button-icon>
                <span class="slds-text-body_regular">
                    Circuit {circuitLabel}
                </span>
                <lightning-button-icon
                    icon-name="utility:chevronright"
                    alternative-text="Next circuit"
                    onclick={handleNext}
                    disabled={isNextDisabled}
                    variant="border-filled"
                    class="slds-m-left_small"
                ></lightning-button-icon>
            </div>
        </template>
        <div
            class="container"
            lwc:ref="canvasContainer"
        >
            <canvas
                lwc:ref="circuitCanvas"
                role="img"
                aria-label={circuitAriaLabel}
                data-testid="circuit-canvas"
            ></canvas>
        </div>
    </template>
    <template if:false={hasQasm}>
        <template if:true={recordError}>
            <div
                class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-p-around_small"
                role="status"
                data-testid="qasm-viewer-error"
            >
                <div class="slds-media__body">
                    <p>
                        Could not load circuit QASM:
                        {recordError}
                    </p>
                </div>
            </div>
        </template>
        <template if:false={recordError}>
            <div
                class="slds-text-align_center slds-p-around_medium slds-text-color_weak"
            >
                No circuit QASM provided.
            </div>
        </template>
    </template>
</template>
