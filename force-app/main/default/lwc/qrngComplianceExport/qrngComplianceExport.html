<template>
    <div
        class="slds-section slds-is-open slds-m-bottom_medium"
    >
        <h3 class="slds-section__title">
            <span
                class="slds-truncate slds-p-horizontal_small"
                title="Evidence Export"
                >Evidence Export</span
            >
        </h3>
        <div class="slds-section__content">
            <p
                class="slds-text-body_small slds-text-color_weak slds-m-bottom_small"
            >
                Generate a structured JSON evidence package
                for compliance audits. Select a framework to
                include relevant control mappings.
            </p>
            <div
                class="slds-grid slds-gutters slds-m-bottom_small"
            >
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox
                        label="Framework"
                        value={selectedFramework}
                        options={frameworkOptions}
                        onchange={handleFrameworkChange}
                        placeholder="Select framework"
                    >
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input
                        type="date"
                        label="Start Date"
                        value={startDate}
                        onchange={handleStartDateChange}
                    >
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-input
                        type="date"
                        label="End Date"
                        value={endDate}
                        onchange={handleEndDateChange}
                    >
                    </lightning-input>
                </div>
            </div>
            <lightning-button
                label="Export Evidence"
                variant="brand"
                onclick={handleExport}
                disabled={isExporting}
                icon-name="utility:download"
                class="slds-m-top_small"
            >
            </lightning-button>
            <template if:true={isExporting}>
                <lightning-spinner
                    alternative-text="Exporting..."
                    size="small"
                    class="slds-m-left_small"
                ></lightning-spinner>
            </template>
        </div>
    </div>
</template>
