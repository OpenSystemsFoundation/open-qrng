<template>
    <div class="certificate-container">
        <template lwc:if={certificate}>
            <div class="certificate-header">
                <div class="slds-grid">
                    <div class="slds-col slds-grow">
                        <h2 class="certificate-title">
                            Fairness Certificate
                        </h2>
                        <p class="certificate-id">
                            {certificate.name}
                        </p>
                    </div>
                    <div class="slds-col slds-shrink">
                        <lightning-badge
                            label={statusLabel}
                            class={statusBadgeClass}
                            data-testid="cert-status-badge"
                        ></lightning-badge>
                    </div>
                </div>
            </div>

            <template if:true={isTampered}>
                <div
                    class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small"
                    role="alert"
                >
                    <h2>
                        Integrity check failed — the
                        underlying data may have been
                        modified since this certificate was
                        issued.
                    </h2>
                </div>
            </template>

            <div class="certificate-body">
                <!-- Visual hash (pixel art from SHA-256) -->
                <div
                    class="slds-text-align_center slds-m-bottom_medium"
                >
                    <canvas
                        lwc:ref="hashCanvas"
                        width="128"
                        height="128"
                        role="img"
                        aria-label="Certificate visual hash, pixel art derived from the raw bitstring SHA-256 hash"
                        data-testid="visual-hash"
                    ></canvas>
                    <p
                        class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                    >
                        Visual Hash
                    </p>
                </div>

                <div
                    class="slds-grid slds-wrap slds-gutters"
                >
                    <div
                        class="slds-col slds-size_1-of-2 slds-m-bottom_small"
                    >
                        <dl class="slds-dl_horizontal">
                            <dt
                                class="slds-dl_horizontal__label cert-label"
                            >
                                External Job ID:
                            </dt>
                            <dd
                                class="slds-dl_horizontal__detail"
                            >
                                {certificate.externalJobId}
                            </dd>
                            <dt
                                class="slds-dl_horizontal__label cert-label"
                            >
                                Backend:
                            </dt>
                            <dd
                                class="slds-dl_horizontal__detail"
                            >
                                {certificate.backend}
                            </dd>
                            <dt
                                class="slds-dl_horizontal__label cert-label"
                            >
                                Purpose:
                            </dt>
                            <dd
                                class="slds-dl_horizontal__detail"
                            >
                                {certificate.purpose}
                            </dd>
                            <dt
                                class="slds-dl_horizontal__label cert-label"
                            >
                                Created:
                            </dt>
                            <dd
                                class="slds-dl_horizontal__detail"
                            >
                                <lightning-formatted-date-time
                                    value={certificate.createdDate}
                                    year="numeric"
                                    month="short"
                                    day="2-digit"
                                    hour="2-digit"
                                    minute="2-digit"
                                ></lightning-formatted-date-time>
                            </dd>
                        </dl>
                    </div>
                    <div
                        class="slds-col slds-size_1-of-2 slds-m-bottom_small"
                    >
                        <h3
                            class="slds-text-heading_small slds-m-bottom_x-small"
                        >
                            Backend Quantum Verification
                        </h3>
                        <dl class="slds-dl_horizontal">
                            <dt
                                class="slds-dl_horizontal__label cert-label"
                            >
                                Status:
                            </dt>
                            <dd
                                class="slds-dl_horizontal__detail"
                            >
                                <lightning-badge
                                    label={backendVerifiedLabel}
                                    class={backendVerifiedClass}
                                ></lightning-badge>
                            </dd>
                            <template if:true={hasCHSH}>
                                <dt
                                    class="slds-dl_horizontal__label cert-label"
                                >
                                    CHSH S-Value:
                                </dt>
                                <dd
                                    class="slds-dl_horizontal__detail"
                                >
                                    {certificate.chshSValue}
                                </dd>
                            </template>
                            <template
                                if:true={certificate.backendVerifiedAt}
                            >
                                <dt
                                    class="slds-dl_horizontal__label cert-label"
                                >
                                    Verified At:
                                </dt>
                                <dd
                                    class="slds-dl_horizontal__detail"
                                >
                                    <lightning-formatted-date-time
                                        value={certificate.backendVerifiedAt}
                                        year="numeric"
                                        month="short"
                                        day="2-digit"
                                        hour="2-digit"
                                        minute="2-digit"
                                    ></lightning-formatted-date-time>
                                </dd>
                            </template>
                        </dl>
                    </div>
                </div>

                <!-- Hashes -->
                <div class="slds-m-top_small">
                    <h3
                        class="slds-text-heading_small slds-m-bottom_x-small"
                    >
                        Integrity Hashes (SHA-256)
                    </h3>
                    <div class="hash-row">
                        <span class="hash-label"
                            >Raw Bitstring:</span
                        >
                        <code class="hash-value"
                            >{certificate.rawBitstringHash}</code
                        >
                    </div>
                    <div class="hash-row">
                        <span class="hash-label"
                            >Debiased:</span
                        >
                        <code class="hash-value"
                            >{certificate.debiasedBitstringHash}</code
                        >
                    </div>
                    <template
                        if:true={certificate.assignmentHash}
                    >
                        <div class="hash-row">
                            <span class="hash-label"
                                >Assignment:</span
                            >
                            <code class="hash-value"
                                >{certificate.assignmentHash}</code
                            >
                        </div>
                    </template>
                </div>

                <!-- Validation Results -->
                <template if:true={validationResults}>
                    <div class="slds-m-top_medium">
                        <h3
                            class="slds-text-heading_small slds-m-bottom_x-small"
                        >
                            Validation Results
                        </h3>
                        <div
                            class="slds-grid slds-wrap slds-gutters_x-small"
                        >
                            <div
                                class="slds-col slds-size_1-of-3"
                            >
                                <div
                                    class={frequencyTestClass}
                                >
                                    <lightning-icon
                                        icon-name={frequencyTestIcon}
                                        size="x-small"
                                        class="slds-m-right_xx-small"
                                    ></lightning-icon>
                                    Frequency Test
                                </div>
                            </div>
                            <div
                                class="slds-col slds-size_1-of-3"
                            >
                                <div class={runsTestClass}>
                                    <lightning-icon
                                        icon-name={runsTestIcon}
                                        size="x-small"
                                        class="slds-m-right_xx-small"
                                    ></lightning-icon>
                                    Runs Test
                                </div>
                            </div>
                            <div
                                class="slds-col slds-size_1-of-3"
                            >
                                <div
                                    class={chiSquaredTestClass}
                                >
                                    <lightning-icon
                                        icon-name={chiSquaredTestIcon}
                                        size="x-small"
                                        class="slds-m-right_xx-small"
                                    ></lightning-icon>
                                    Chi-Squared
                                </div>
                            </div>
                        </div>

                        <!-- Extended NIST Tests -->
                        <template
                            if:true={hasExtendedResults}
                        >
                            <h4
                                class="slds-text-title_caps slds-m-top_small slds-m-bottom_xx-small"
                            >
                                Extended Tests (SP 800-90B
                                &amp; NIST)
                            </h4>
                            <div
                                class="slds-grid slds-wrap slds-gutters_x-small"
                            >
                                <template
                                    for:each={extendedTests}
                                    for:item="test"
                                >
                                    <div
                                        key={test.key}
                                        class="slds-col slds-size_1-of-4"
                                    >
                                        <div
                                            class={test.badgeClass}
                                        >
                                            <lightning-icon
                                                icon-name={test.iconName}
                                                size="x-small"
                                                class="slds-m-right_xx-small"
                                            ></lightning-icon>
                                            {test.label}
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Verify Button -->
                <div
                    class="slds-m-top_medium slds-text-align_center"
                >
                    <lightning-button
                        label="Verify Integrity"
                        variant="neutral"
                        icon-name="utility:check"
                        onclick={handleVerify}
                        disabled={isVerifying}
                        data-testid="verify-integrity-btn"
                    >
                    </lightning-button>
                    <template if:true={verificationResult}>
                        <p class={verificationClass}>
                            {verificationMessage}
                        </p>
                    </template>
                </div>
            </div>
        </template>
        <template lwc:elseif={loadError}>
            <div
                class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-p-around_small"
                role="status"
                data-testid="cert-load-error"
            >
                <div class="slds-media__body">
                    <p>
                        Could not load the fairness
                        certificate: {loadError}
                    </p>
                </div>
            </div>
        </template>
        <template lwc:elseif={isLoading}>
            <lightning-spinner
                alternative-text="Loading certificate..."
                size="medium"
            ></lightning-spinner>
        </template>
        <template lwc:else>
            <div
                class="slds-text-align_center slds-p-around_medium slds-text-color_weak"
                data-testid="cert-empty-state"
            >
                No certificate to display.
            </div>
        </template>
    </div>
</template>
