<template>
    <lightning-card
        title={cardTitle}
        icon-name="standard:calibration"
    >
        <div slot="actions">
            <lightning-button
                label="Run All Tests"
                icon-name="utility:play"
                variant="brand"
                onclick={handleRunTests}
                disabled={isRunning}
            ></lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <template if:true={hasResults}>
                <!-- Overall Status -->
                <div
                    class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium"
                >
                    <div>
                        <span class={overallStatusClass}
                            >{overallStatusLabel}</span
                        >
                        <span
                            class="slds-text-body_small slds-text-color_weak slds-m-left_small"
                        >
                            {bitCount} bits analyzed
                            &middot; {onesProportion} ones
                        </span>
                    </div>
                    <template if:true={lastRunTimestamp}>
                        <span
                            class="slds-text-body_small slds-text-color_weak"
                        >
                            Last run: {lastRunTimestamp}
                        </span>
                    </template>
                </div>

                <!-- Critical Tests Section (QRNG jobs only) -->
                <template if:true={showCriticalTests}>
                    <div class="slds-m-bottom_medium">
                        <h3
                            class="slds-text-heading_small slds-m-bottom_x-small section-header"
                        >
                            Critical Gate Tests
                            <span
                                class="slds-text-body_small slds-text-color_weak"
                                >&mdash; blocks
                                certification</span
                            >
                        </h3>
                        <div class="test-grid">
                            <template
                                for:each={criticalTests}
                                for:item="test"
                            >
                                <div
                                    key={test.key}
                                    class={test.badgeClass}
                                >
                                    <lightning-icon
                                        icon-name={test.iconName}
                                        variant={test.iconVariant}
                                        size="x-small"
                                        class="slds-m-right_xx-small"
                                    ></lightning-icon>
                                    <div>
                                        <span
                                            class="test-label"
                                            >{test.label}</span
                                        >
                                        <span
                                            class="test-desc"
                                            >{test.description}</span
                                        >
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Bell Test Section (if applicable) -->
                <template if:true={hasBellResults}>
                    <div class="slds-m-bottom_medium">
                        <div
                            class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small"
                        >
                            <h3
                                class="slds-text-heading_small section-header"
                            >
                                Quantum Origin Proof
                                <span
                                    class="slds-text-body_small slds-text-color_weak"
                                    >&mdash; CHSH S =
                                    {chshSValue}</span
                                >
                            </h3>
                            <lightning-button
                                label="View Circuit"
                                icon-name="utility:preview"
                                variant="neutral"
                                onclick={handleViewCircuit}
                            ></lightning-button>
                        </div>
                        <div class="test-grid">
                            <template
                                for:each={bellTests}
                                for:item="test"
                            >
                                <div
                                    key={test.key}
                                    class={test.badgeClass}
                                >
                                    <lightning-icon
                                        icon-name={test.iconName}
                                        variant={test.iconVariant}
                                        size="x-small"
                                        class="slds-m-right_xx-small"
                                    ></lightning-icon>
                                    <div>
                                        <span
                                            class="test-label"
                                            >{test.label}</span
                                        >
                                        <span
                                            class="test-desc"
                                            >{test.description}</span
                                        >
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- CHSH Visualizer: gauge + correlator breakdown -->
                    <c-qrng-chsh-visualizer
                        validation-results={validationResultsJson}
                    ></c-qrng-chsh-visualizer>
                </template>

                <!-- Extended Tests Section (QRNG jobs only) -->
                <template if:true={showExtendedTests}>
                    <div class="slds-m-bottom_small">
                        <h3
                            class="slds-text-heading_small slds-m-bottom_x-small section-header"
                        >
                            Extended NIST Tests
                            <template
                                if:false={hasExtendedResults}
                            >
                                <span
                                    class="slds-text-body_small slds-text-color_weak"
                                    >&mdash; pending (click
                                    Run All Tests)</span
                                >
                            </template>
                        </h3>
                        <div class="test-grid">
                            <template
                                for:each={extendedTests}
                                for:item="test"
                            >
                                <div
                                    key={test.key}
                                    class={test.badgeClass}
                                >
                                    <lightning-icon
                                        icon-name={test.iconName}
                                        variant={test.iconVariant}
                                        size="x-small"
                                        class="slds-m-right_xx-small"
                                    ></lightning-icon>
                                    <div>
                                        <span
                                            class="test-label"
                                            >{test.label}</span
                                        >
                                        <span
                                            class="test-desc"
                                            >{test.description}</span
                                        >
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </template>

            <template if:false={hasResults}>
                <template if:true={loadError}>
                    <div
                        class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-p-around_small"
                        role="status"
                        data-testid="validation-results-error"
                    >
                        <div class="slds-media__body">
                            <p>
                                Could not load validation
                                results: {loadError}
                            </p>
                        </div>
                    </div>
                </template>
                <template if:false={loadError}>
                    <div
                        class="slds-illustration slds-illustration_small slds-text-align_center"
                    >
                        <p
                            class="slds-text-body_regular slds-text-color_weak"
                        >
                            No validation results yet.
                            Complete the job or click "Run
                            All Tests" to validate.
                        </p>
                    </div>
                </template>
            </template>

            <!-- Loading -->
            <template if:true={isRunning}>
                <div
                    class="slds-align_absolute-center slds-m-top_medium"
                >
                    <lightning-spinner
                        alternative-text="Running tests..."
                        size="small"
                    ></lightning-spinner>
                    <span class="slds-m-left_small"
                        >Running all randomness
                        tests...</span
                    >
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- Circuit Diagram Modal -->
    <template if:true={showCircuitModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="circuit-modal-heading"
            class="slds-modal slds-fade-in-open slds-modal_large"
            onkeydown={handleModalKeydown}
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close circuit diagram"
                        class="slds-modal__close"
                        onclick={handleCloseCircuit}
                        data-modal-close
                    ></lightning-button-icon>
                    <h2
                        id="circuit-modal-heading"
                        class="slds-modal__title"
                    >
                        Quantum Circuit Diagram
                    </h2>
                </header>
                <div
                    class="slds-modal__content slds-p-around_medium"
                >
                    <c-qrng-circuit-visualizer
                        num-qubits={circuitQubits}
                        use-bell-test
                    ></c-qrng-circuit-visualizer>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        onclick={handleCloseCircuit}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
