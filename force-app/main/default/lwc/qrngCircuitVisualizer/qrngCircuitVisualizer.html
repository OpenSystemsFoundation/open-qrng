<template>
    <lightning-card
        title="Circuit Diagram"
        icon-name="standard:flow"
    >
        <div class="slds-p-around_small">
            <div
                class="canvas-container"
                lwc:ref="canvasContainer"
            >
                <canvas lwc:ref="circuitCanvas"></canvas>
            </div>
            <div
                class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
            >
                <template if:false={useBellTest}>
                    Standard QRNG: H + Measure on
                    {numQubits} qubit(s) | ISA: rz(pi/2) -
                    sx - rz(pi/2)
                </template>
                <template if:true={useBellTest}>
                    CHSH Bell Test: 4-basis entangled
                    measurement | ISA: H → CZ → Ry(θ) →
                    Measure | {numQubits} qubit(s)
                </template>
            </div>
        </div>
    </lightning-card>
</template>
