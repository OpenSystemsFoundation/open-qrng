<template>
    <lightning-card
        title="Audit Trail"
        icon-name="standard:entitlement"
    >
        <div class="slds-p-around_medium">
            <template if:true={loadError}>
                <div
                    class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-p-around_small slds-m-bottom_small"
                    role="status"
                    data-testid="audit-trail-error"
                >
                    <div class="slds-media__body">
                        <p>
                            Could not load the audit trail:
                            {loadError}
                        </p>
                    </div>
                </div>
            </template>
            <template if:true={hasCertificates}>
                <div
                    class="slds-timeline"
                    data-testid="audit-timeline"
                >
                    <template
                        for:each={certificates}
                        for:item="cert"
                    >
                        <div
                            key={cert.recordId}
                            class="timeline-item slds-m-bottom_small"
                            data-testid="audit-item"
                        >
                            <div
                                class="slds-grid slds-gutters_small"
                            >
                                <div
                                    class="slds-col slds-shrink"
                                >
                                    <lightning-icon
                                        icon-name={cert.iconName}
                                        size="small"
                                        class="slds-m-right_small"
                                    >
                                    </lightning-icon>
                                </div>
                                <div
                                    class="slds-col slds-grow"
                                >
                                    <div class="slds-grid">
                                        <div
                                            class="slds-col slds-grow"
                                        >
                                            <p
                                                class="slds-text-heading_small"
                                            >
                                                <button
                                                    class="slds-button slds-button_reset slds-text-link"
                                                    onclick={handleCertClick}
                                                    data-id={cert.recordId}
                                                    data-testid="cert-link"
                                                >
                                                    {cert.name}
                                                </button>
                                            </p>
                                            <p
                                                class="slds-text-body_small"
                                            >
                                                {cert.purpose}
                                            </p>
                                        </div>
                                        <div
                                            class="slds-col slds-shrink slds-text-align_right"
                                        >
                                            <lightning-badge
                                                label={cert.badgeLabel}
                                                class={cert.badgeClass}
                                            ></lightning-badge>
                                            <p
                                                class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                                            >
                                                <lightning-formatted-date-time
                                                    value={cert.createdDate}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit"
                                                    hour="2-digit"
                                                    minute="2-digit"
                                                ></lightning-formatted-date-time>
                                            </p>
                                        </div>
                                    </div>
                                    <p
                                        class="slds-text-body_small slds-text-color_weak"
                                    >
                                        Backend:
                                        {cert.backend} | Job
                                        ID:
                                        {cert.externalJobId}
                                    </p>
                                    <template
                                        if:true={cert.chshSValue}
                                    >
                                        <p
                                            class="slds-text-body_small"
                                        >
                                            CHSH S-Value:
                                            <strong
                                                >{cert.chshSValueLabel}</strong
                                            >
                                            <template
                                                if:true={cert.isQuantumCertified}
                                            >
                                                <span
                                                    class="quantum-badge"
                                                    >Quantum
                                                    Certified</span
                                                >
                                            </template>
                                        </p>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasCertificates}>
                <div
                    class="slds-text-align_center slds-p-around_large slds-text-color_weak"
                >
                    <p>
                        No fairness certificates have been
                        issued yet.
                    </p>
                    <p class="slds-m-top_small">
                        Submit a quantum circuit to generate
                        your first certificate.
                    </p>
                </div>
            </template>

            <!-- Certificate detail modal -->
            <template if:true={selectedCertId}>
                <section
                    role="dialog"
                    tabindex="-1"
                    aria-modal="true"
                    aria-labelledby="cert-detail-heading"
                    class="slds-modal slds-fade-in-open"
                    onkeydown={handleModalKeydown}
                    data-testid="cert-modal"
                >
                    <div class="slds-modal__container">
                        <header
                            class="slds-modal__header slds-modal__header_empty"
                        >
                            <h2
                                id="cert-detail-heading"
                                class="slds-assistive-text"
                            >
                                Fairness Certificate Details
                            </h2>
                            <button
                                class="slds-button slds-button_icon slds-modal__close"
                                onclick={closeCertDetail}
                                data-modal-close
                                data-testid="close-modal-btn"
                            >
                                <lightning-icon
                                    icon-name="utility:close"
                                    size="small"
                                ></lightning-icon>
                                <span
                                    class="slds-assistive-text"
                                    >Close certificate
                                    details</span
                                >
                            </button>
                        </header>
                        <div
                            class="slds-modal__content slds-p-around_medium"
                        >
                            <c-qrng-fairness-certificate
                                certificate-id={selectedCertId}
                            ></c-qrng-fairness-certificate>
                        </div>
                    </div>
                </section>
                <div
                    class="slds-backdrop slds-backdrop_open"
                    onclick={closeCertDetail}
                ></div>
            </template>
        </div>
    </lightning-card>
</template>
