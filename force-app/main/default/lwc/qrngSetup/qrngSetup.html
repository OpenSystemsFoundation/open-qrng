<template>
    <lightning-card
        title="QuantumFair Setup"
        icon-name="standard:settings"
    >
        <div class="slds-p-around_medium">
            <!-- Connection Status -->
            <div
                class="slds-section slds-is-open slds-m-bottom_medium"
            >
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Connection"
                        >Connection Status</span
                    >
                </h3>
                <div class="slds-section__content">
                    <div
                        class="slds-grid slds-gutters slds-m-bottom_small"
                    >
                        <div class="slds-col">
                            <lightning-badge
                                label={connectionStatusLabel}
                                class={connectionBadgeClass}
                            >
                            </lightning-badge>
                        </div>
                        <div
                            class="slds-col slds-col_bump-left"
                        >
                            <lightning-button
                                label="Test Connection"
                                variant="neutral"
                                onclick={handleTestConnection}
                                disabled={isTestingConnection}
                            >
                            </lightning-button>
                        </div>
                    </div>
                    <template if:true={connectionMessage}>
                        <p
                            class="slds-text-body_small slds-text-color_weak"
                        >
                            {connectionMessage}
                        </p>
                    </template>
                </div>
            </div>

            <!-- API Key Configuration -->
            <div
                class="slds-section slds-is-open slds-m-bottom_medium"
            >
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Settings"
                        >Settings</span
                    >
                </h3>
                <div class="slds-section__content">
                    <lightning-input
                        type="password"
                        label="IBM Quantum API Key"
                        value={apiKey}
                        onchange={handleApiKeyChange}
                        placeholder="Enter your IBM Quantum API key"
                        class="slds-m-bottom_small"
                    >
                    </lightning-input>
                    <div
                        class="slds-grid slds-gutters slds-m-bottom_small"
                    >
                        <div class="slds-col slds-grow">
                            <lightning-input
                                label="Instance CRN"
                                value={instanceCRN}
                                onchange={handleCRNChange}
                                placeholder="crn:v1:bluemix:public:quantum-computing:..."
                                field-level-help="Find this in your IBM Cloud dashboard under your Quantum service instance"
                            >
                            </lightning-input>
                        </div>
                        <div
                            class="slds-col slds-no-flex slds-align-bottom"
                        >
                            <lightning-button
                                label="Auto-detect"
                                variant="neutral"
                                onclick={handleDiscoverCRN}
                                disabled={isDiscoveringCRN}
                                icon-name="utility:search"
                            >
                            </lightning-button>
                        </div>
                    </div>
                    <lightning-combobox
                        label="Default Backend"
                        value={defaultBackend}
                        options={backendOptions}
                        onchange={handleBackendChange}
                        placeholder="Select a backend"
                        class="slds-m-bottom_small"
                    >
                    </lightning-combobox>
                    <lightning-input
                        type="number"
                        label="Default Shots"
                        value={defaultShots}
                        onchange={handleShotsChange}
                        min="100"
                        max="8192"
                        class="slds-m-bottom_small"
                    >
                    </lightning-input>
                    <lightning-input
                        type="checkbox"
                        label="Use Bell Test by Default"
                        checked={useBellTest}
                        onchange={handleBellTestChange}
                        class="slds-m-bottom_small"
                    >
                    </lightning-input>
                    <lightning-button
                        label="Save Settings"
                        variant="brand"
                        onclick={handleSaveSettings}
                        class="slds-m-top_small"
                    >
                    </lightning-button>
                </div>
            </div>

            <!-- Job Sweeper -->
            <div
                class="slds-section slds-is-open slds-m-bottom_medium"
            >
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Job Sweeper"
                        >Job Sweeper</span
                    >
                </h3>
                <div class="slds-section__content">
                    <div
                        class="slds-grid slds-gutters slds-grid_vertical-align-center"
                    >
                        <div class="slds-col">
                            <lightning-badge
                                label={sweeperStatusLabel}
                                class={sweeperBadgeClass}
                            >
                            </lightning-badge>
                        </div>
                        <div
                            class="slds-col slds-col_bump-left"
                        >
                            <lightning-button
                                label={sweeperButtonLabel}
                                variant={sweeperButtonVariant}
                                onclick={handleToggleSweeper}
                                icon-name="utility:clock"
                            >
                            </lightning-button>
                        </div>
                    </div>
                    <lightning-input
                        type="number"
                        label="Interval (minutes)"
                        value={pollIntervalMinutes}
                        onchange={handlePollIntervalChange}
                        min="1"
                        max="60"
                        disabled={sweeperActive}
                        field-level-help="How often the background sweeper checks pending jobs. Stop the sweeper to change."
                        class="slds-m-top_small"
                    >
                    </lightning-input>
                    <p
                        class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
                    >
                        Automatically checks pending quantum
                        jobs every {pollIntervalMinutes}
                        minutes.
                    </p>
                </div>
            </div>

            <!-- Integrity Verification -->
            <div
                class="slds-section slds-is-open slds-m-bottom_medium"
            >
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Integrity Verification"
                        >Integrity Verification</span
                    >
                </h3>
                <div class="slds-section__content">
                    <div
                        class="slds-grid slds-gutters slds-grid_vertical-align-center"
                    >
                        <div class="slds-col">
                            <lightning-badge
                                label={integrityStatusLabel}
                                class={integrityBadgeClass}
                            >
                            </lightning-badge>
                        </div>
                        <div
                            class="slds-col slds-col_bump-left"
                        >
                            <lightning-button
                                label={integrityButtonLabel}
                                variant={integrityButtonVariant}
                                onclick={handleToggleIntegrityCheck}
                                icon-name="utility:shield"
                            >
                            </lightning-button>
                        </div>
                    </div>
                    <lightning-input
                        type="number"
                        label="Check Hour (0-23)"
                        value={integrityCheckHour}
                        onchange={handleIntegrityHourChange}
                        min="0"
                        max="23"
                        disabled={integrityCheckActive}
                        field-level-help="Hour of day for the nightly integrity check. Stop the job to change."
                        class="slds-m-top_small"
                    >
                    </lightning-input>
                    <p
                        class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
                    >
                        Nightly SHA-256 integrity
                        verification of all certificates at
                        {integrityCheckHour}:00.
                    </p>
                </div>
            </div>

            <!-- Backend Health -->
            <div
                class="slds-section slds-is-open slds-m-bottom_medium"
            >
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Backend Health"
                        >Backend Health</span
                    >
                </h3>
                <div class="slds-section__content">
                    <div class="slds-m-bottom_small">
                        <lightning-button
                            label="Refresh Backend Health"
                            variant="neutral"
                            onclick={handleRefreshHealth}
                            disabled={isLoadingHealth}
                            icon-name="utility:refresh"
                        >
                        </lightning-button>
                    </div>
                    <template if:true={isLoadingHealth}>
                        <lightning-spinner
                            alternative-text="Loading..."
                            size="small"
                        ></lightning-spinner>
                    </template>
                    <template if:true={hasBackendHealth}>
                        <div class="slds-scrollable_x">
                            <table
                                class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped"
                            >
                                <thead>
                                    <tr>
                                        <th>Backend</th>
                                        <th>Fidelity</th>
                                        <th>Status</th>
                                        <th>Qubits</th>
                                        <th>Queue</th>
                                        <th>Processor</th>
                                        <th>Avg T1</th>
                                        <th>Avg T2</th>
                                        <th>Gate Err</th>
                                        <th>Readout Err</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template
                                        for:each={backendHealthList}
                                        for:item="b"
                                    >
                                        <tr key={b.id}>
                                            <td>
                                                <strong
                                                    >{b.name}</strong
                                                >
                                            </td>
                                            <td>
                                                <span
                                                    class={b.fidelityClass}
                                                    title={b.fidelityTitle}
                                                    >{b.fidelityScore}</span
                                                >
                                            </td>
                                            <td>
                                                <span
                                                    class={b.statusClass}
                                                    >{b.status}</span
                                                >
                                            </td>
                                            <td>
                                                {b.qubits}
                                            </td>
                                            <td>
                                                {b.queueLength}
                                            </td>
                                            <td>
                                                {b.processor}
                                            </td>
                                            <td>
                                                {b.avgT1}
                                            </td>
                                            <td>
                                                {b.avgT2}
                                            </td>
                                            <td>
                                                {b.gateError}
                                            </td>
                                            <td>
                                                {b.readoutError}
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:false={hasBackendHealth}>
                        <p
                            class="slds-text-body_small slds-text-color_weak"
                        >
                            No backend data yet. Click Test
                            Connection to sync backends,
                            then Refresh to fetch health
                            data.
                        </p>
                    </template>
                </div>
            </div>

            <!-- Usage Stats -->
            <div class="slds-section slds-is-open">
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Usage"
                        >Usage Dashboard</span
                    >
                </h3>
                <div class="slds-section__content">
                    <div
                        class="slds-grid slds-wrap slds-gutters"
                    >
                        <div
                            class="slds-col slds-size_1-of-3 slds-p-around_x-small"
                        >
                            <div class="stat-card">
                                <p class="stat-value">
                                    {totalJobs}
                                </p>
                                <p class="stat-label">
                                    Total Jobs
                                </p>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-3 slds-p-around_x-small"
                        >
                            <div class="stat-card">
                                <p class="stat-value">
                                    {completedJobs}
                                </p>
                                <p class="stat-label">
                                    Completed
                                </p>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-3 slds-p-around_x-small"
                        >
                            <div class="stat-card">
                                <p class="stat-value">
                                    {totalCertificates}
                                </p>
                                <p class="stat-label">
                                    Certificates
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
