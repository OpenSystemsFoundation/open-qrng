<template>
    <lightning-card
        title="QuantumFair Setup"
        icon-name="standard:settings"
    >
        <div class="slds-p-around_medium">
            <!-- Connection Status -->
            <div
                class="slds-section slds-is-open slds-m-bottom_medium"
            >
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Connection"
                        >Connection Status</span
                    >
                </h3>
                <div class="slds-section__content">
                    <div
                        class="slds-grid slds-gutters slds-m-bottom_small"
                    >
                        <div class="slds-col">
                            <lightning-badge
                                label={connectionStatusLabel}
                                class={connectionBadgeClass}
                            >
                            </lightning-badge>
                        </div>
                        <div
                            class="slds-col slds-col_bump-left"
                        >
                            <lightning-button
                                label="Test Connection"
                                variant="neutral"
                                onclick={handleTestConnection}
                                disabled={isTestingConnection}
                            >
                            </lightning-button>
                        </div>
                    </div>
                    <template if:true={connectionMessage}>
                        <p
                            class="slds-text-body_small slds-text-color_weak"
                        >
                            {connectionMessage}
                        </p>
                    </template>
                </div>
            </div>

            <!-- API Key Configuration -->
            <div
                class="slds-section slds-is-open slds-m-bottom_medium"
            >
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Settings"
                        >Settings</span
                    >
                </h3>
                <div class="slds-section__content">
                    <lightning-input
                        type="password"
                        label="IBM Quantum API Key"
                        value={apiKey}
                        onchange={handleApiKeyChange}
                        placeholder="Enter your IBM Quantum API key"
                        class="slds-m-bottom_small"
                    >
                    </lightning-input>
                    <div
                        class="slds-grid slds-gutters slds-m-bottom_small"
                    >
                        <div class="slds-col slds-grow">
                            <lightning-input
                                label="Instance CRN"
                                value={instanceCRN}
                                onchange={handleCRNChange}
                                placeholder="crn:v1:bluemix:public:quantum-computing:..."
                                field-level-help="Find this in your IBM Cloud dashboard under your Quantum service instance"
                            >
                            </lightning-input>
                        </div>
                        <div
                            class="slds-col slds-no-flex slds-align-bottom"
                        >
                            <lightning-button
                                label="Auto-detect"
                                variant="neutral"
                                onclick={handleDiscoverCRN}
                                disabled={isDiscoveringCRN}
                                icon-name="utility:search"
                            >
                            </lightning-button>
                        </div>
                    </div>
                    <lightning-combobox
                        label="Default Backend"
                        value={defaultBackend}
                        options={backendOptions}
                        onchange={handleBackendChange}
                        placeholder="Select a backend"
                        class="slds-m-bottom_small"
                    >
                    </lightning-combobox>
                    <lightning-input
                        type="number"
                        label="Default Shots"
                        value={defaultShots}
                        onchange={handleShotsChange}
                        min="100"
                        max="8192"
                        class="slds-m-bottom_small"
                    >
                    </lightning-input>
                    <lightning-input
                        type="checkbox"
                        label="Use Bell Test by Default"
                        checked={useBellTest}
                        onchange={handleBellTestChange}
                        class="slds-m-bottom_small"
                    >
                    </lightning-input>
                    <lightning-input
                        type="checkbox"
                        label="Use Least Busy Backend"
                        checked={useLeastBusy}
                        onchange={handleLeastBusyChange}
                        field-level-help="Automatically submit jobs to the backend with the shortest queue"
                        class="slds-m-bottom_small"
                    >
                    </lightning-input>
                    <lightning-input
                        type="number"
                        label="Job Sweeper Interval (minutes)"
                        value={pollIntervalMinutes}
                        onchange={handlePollIntervalChange}
                        min="1"
                        max="60"
                        field-level-help="How often the background sweeper checks pending jobs"
                        class="slds-m-bottom_small"
                    >
                    </lightning-input>
                    <lightning-button
                        label="Save Settings"
                        variant="brand"
                        onclick={handleSaveSettings}
                        class="slds-m-top_small"
                    >
                    </lightning-button>
                </div>
            </div>

            <!-- Job Sweeper -->
            <div
                class="slds-section slds-is-open slds-m-bottom_medium"
            >
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Job Sweeper"
                        >Job Sweeper</span
                    >
                </h3>
                <div class="slds-section__content">
                    <div
                        class="slds-grid slds-gutters slds-grid_vertical-align-center"
                    >
                        <div class="slds-col">
                            <lightning-badge
                                label={sweeperStatusLabel}
                                class={sweeperBadgeClass}
                            >
                            </lightning-badge>
                        </div>
                        <div
                            class="slds-col slds-col_bump-left"
                        >
                            <lightning-button
                                label={sweeperButtonLabel}
                                variant={sweeperButtonVariant}
                                onclick={handleToggleSweeper}
                                icon-name="utility:clock"
                            >
                            </lightning-button>
                        </div>
                    </div>
                    <p
                        class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
                    >
                        Automatically checks pending quantum
                        jobs every {pollIntervalMinutes}
                        minutes.
                    </p>
                </div>
            </div>

            <!-- Backend Health -->
            <div
                class="slds-section slds-is-open slds-m-bottom_medium"
            >
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Backend Health"
                        >Backend Health</span
                    >
                </h3>
                <div class="slds-section__content">
                    <div class="slds-m-bottom_small">
                        <lightning-button
                            label="Refresh Backend Health"
                            variant="neutral"
                            onclick={handleRefreshHealth}
                            disabled={isLoadingHealth}
                            icon-name="utility:refresh"
                        >
                        </lightning-button>
                    </div>
                    <template if:true={isLoadingHealth}>
                        <lightning-spinner
                            alternative-text="Loading..."
                            size="small"
                        ></lightning-spinner>
                    </template>
                    <template if:true={hasBackendHealth}>
                        <div
                            class="slds-grid slds-wrap slds-gutters"
                        >
                            <div
                                class="slds-col slds-size_1-of-2 slds-p-around_x-small"
                            >
                                <div class="stat-card">
                                    <p class="stat-value">
                                        {formattedT1}
                                    </p>
                                    <p class="stat-label">
                                        Avg T1 (relaxation)
                                    </p>
                                </div>
                            </div>
                            <div
                                class="slds-col slds-size_1-of-2 slds-p-around_x-small"
                            >
                                <div class="stat-card">
                                    <p class="stat-value">
                                        {formattedT2}
                                    </p>
                                    <p class="stat-label">
                                        Avg T2 (coherence)
                                    </p>
                                </div>
                            </div>
                            <div
                                class="slds-col slds-size_1-of-2 slds-p-around_x-small"
                            >
                                <div class="stat-card">
                                    <p class="stat-value">
                                        {formattedGateError}
                                    </p>
                                    <p class="stat-label">
                                        Avg Gate Error
                                    </p>
                                </div>
                            </div>
                            <div
                                class="slds-col slds-size_1-of-2 slds-p-around_x-small"
                            >
                                <div class="stat-card">
                                    <p class="stat-value">
                                        {formattedReadoutError}
                                    </p>
                                    <p class="stat-label">
                                        Avg Readout Error
                                    </p>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Usage Stats -->
            <div class="slds-section slds-is-open">
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Usage"
                        >Usage Dashboard</span
                    >
                </h3>
                <div class="slds-section__content">
                    <div
                        class="slds-grid slds-wrap slds-gutters"
                    >
                        <div
                            class="slds-col slds-size_1-of-3 slds-p-around_x-small"
                        >
                            <div class="stat-card">
                                <p class="stat-value">
                                    {totalJobs}
                                </p>
                                <p class="stat-label">
                                    Total Jobs
                                </p>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-3 slds-p-around_x-small"
                        >
                            <div class="stat-card">
                                <p class="stat-value">
                                    {completedJobs}
                                </p>
                                <p class="stat-label">
                                    Completed
                                </p>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-3 slds-p-around_x-small"
                        >
                            <div class="stat-card">
                                <p class="stat-value">
                                    {totalCertificates}
                                </p>
                                <p class="stat-label">
                                    Certificates
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
