<template>
    <lightning-card
        title="QuantumFair Setup"
        icon-name="standard:settings"
    >
        <div class="slds-p-around_medium">
            <template if:true={settingsError}>
                <div
                    class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-p-around_small slds-m-bottom_small"
                    role="status"
                    data-testid="setup-settings-error"
                >
                    <div class="slds-media__body">
                        <p>
                            Could not load settings:
                            {settingsError}
                        </p>
                    </div>
                </div>
            </template>
            <c-qrng-connection-setup
                has-api-key={hasApiKey}
                instance-c-r-n={instanceCRN}
                onbackendsloaded={handleBackendsLoaded}
                onapikeychange={handleApiKeyChange}
                oncrnchange={handleCRNChange}
            ></c-qrng-connection-setup>

            <template if:true={hasApiKey}>
                <c-qrng-settings-panel
                    backend-options={backendOptions}
                    has-api-key={hasApiKey}
                    onsettingssaved={handleSettingsSaved}
                ></c-qrng-settings-panel>
            </template>

            <!-- Usage Stats -->
            <div class="slds-section slds-is-open">
                <h3 class="slds-section__title">
                    <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Usage"
                        >Usage Dashboard</span
                    >
                </h3>
                <div class="slds-section__content">
                    <template if:true={statsError}>
                        <p
                            class="slds-text-color_error slds-text-body_small slds-m-bottom_x-small"
                            data-testid="setup-stats-error"
                        >
                            Could not load usage stats:
                            {statsError}
                        </p>
                    </template>
                    <div
                        class="slds-grid slds-wrap slds-gutters"
                    >
                        <div
                            class="slds-col slds-size_1-of-3 slds-p-around_x-small"
                        >
                            <div class="stat-card">
                                <p class="stat-value">
                                    {totalJobs}
                                </p>
                                <p class="stat-label">
                                    Total Jobs
                                </p>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-3 slds-p-around_x-small"
                        >
                            <div class="stat-card">
                                <p class="stat-value">
                                    {completedJobs}
                                </p>
                                <p class="stat-label">
                                    Completed
                                </p>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-3 slds-p-around_x-small"
                        >
                            <div class="stat-card">
                                <p class="stat-value">
                                    {totalCertificates}
                                </p>
                                <p class="stat-label">
                                    Certificates
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
