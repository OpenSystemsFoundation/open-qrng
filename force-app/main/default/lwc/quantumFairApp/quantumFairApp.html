<template>
    <lightning-card
        title="QuantumFair"
        icon-name="custom:custom68"
    >
        <div
            class="slds-p-around_medium"
            data-testid="quantum-fair-app"
        >
            <lightning-tabset>
                <lightning-tab
                    label="Dashboard"
                    data-testid="tab-dashboard"
                >
                    <div class="slds-p-around_small">
                        <c-qrng-request-form
                            onjobsubmitted={handleJobSubmitted}
                        ></c-qrng-request-form>
                        <template if:true={hasActiveJobs}>
                            <template
                                for:each={activeJobs}
                                for:item="job"
                            >
                                <div
                                    key={job.key}
                                    class="slds-m-top_medium slds-is-relative"
                                >
                                    <template
                                        if:true={job.completed}
                                    >
                                        <lightning-button-icon
                                            icon-name="utility:close"
                                            variant="bare"
                                            alternative-text="Dismiss"
                                            class="dismiss-btn"
                                            data-jobid={job.id}
                                            onclick={handleDismissJob}
                                        ></lightning-button-icon>
                                    </template>
                                    <c-qrng-job-monitor
                                        job-id={job.id}
                                        onjobcomplete={handleJobComplete}
                                    ></c-qrng-job-monitor>
                                </div>
                            </template>
                        </template>
                    </div>
                </lightning-tab>
                <lightning-tab
                    label="Jobs"
                    data-testid="tab-jobs"
                >
                    <div class="slds-p-around_small">
                        <c-qrng-job-dashboard></c-qrng-job-dashboard>
                    </div>
                </lightning-tab>
                <lightning-tab
                    label="Setup"
                    data-testid="tab-setup"
                >
                    <c-qrng-setup></c-qrng-setup>
                </lightning-tab>
                <lightning-tab
                    label="Operations"
                    data-testid="tab-operations"
                >
                    <div class="slds-p-around_small">
                        <c-qrng-background-jobs></c-qrng-background-jobs>
                        <c-qrng-health-monitor></c-qrng-health-monitor>
                    </div>
                </lightning-tab>
                <lightning-tab
                    label="Compliance"
                    data-testid="tab-compliance"
                >
                    <div class="slds-p-around_small">
                        <c-qrng-audit-trail></c-qrng-audit-trail>
                        <c-qrng-compliance-export></c-qrng-compliance-export>
                    </div>
                </lightning-tab>
            </lightning-tabset>
        </div>
    </lightning-card>
</template>
