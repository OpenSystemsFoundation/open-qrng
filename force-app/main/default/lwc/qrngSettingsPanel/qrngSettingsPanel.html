<template>
    <div
        class="slds-section slds-is-open slds-m-bottom_medium"
    >
        <h3 class="slds-section__title">
            <span
                class="slds-truncate slds-p-horizontal_small"
                title="Settings"
                >Settings</span
            >
        </h3>
        <div class="slds-section__content">
            <lightning-combobox
                label="Default Backend"
                value={defaultBackend}
                options={backendOptions}
                onchange={handleBackendChange}
                class="slds-m-bottom_small"
                data-testid="settings-backend-select"
            ></lightning-combobox>

            <lightning-input
                type="number"
                label="Default Shots"
                value={defaultShots}
                min="100"
                max="8192"
                onchange={handleShotsChange}
                class="slds-m-bottom_small"
                data-testid="settings-shots-input"
            ></lightning-input>

            <lightning-input
                type="email"
                label="Compliance Email"
                value={complianceEmail}
                placeholder="compliance@yourcompany.com"
                field-level-help="Daily hash digest emails will be sent to this address for out-of-band audit verification"
                onchange={handleComplianceEmailChange}
                class="slds-m-bottom_small"
                data-testid="compliance-email-input"
            ></lightning-input>

            <lightning-button
                label="Save Settings"
                variant="brand"
                onclick={handleSaveSettings}
                data-testid="save-settings-btn"
            ></lightning-button>
        </div>
    </div>
</template>
