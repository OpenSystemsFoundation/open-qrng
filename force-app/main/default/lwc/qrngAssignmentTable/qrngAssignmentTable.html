<template>
    <lightning-card title="Assignment Results" icon-name="standard:record">
        <div class="slds-p-around_small">
            <template if:true={hasAssignments}>
                <lightning-datatable
                    key-field="Id"
                    data={assignments}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </template>
            <template if:false={hasAssignments}>
                <div class="slds-text-align_center slds-p-around_medium slds-text-color_weak">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                    </template>
                    <template if:false={isLoading}>
                        No assignments found for this job
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
