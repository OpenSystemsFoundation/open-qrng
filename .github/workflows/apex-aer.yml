name: Apex Tests (aer-dist)

on:
    push:
        branches: ['**']
    pull_request:
        branches: [master]

jobs:
    apex-test:
        name: Apex Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run Apex Tests
              uses: octoberswimmer/aer-dist@main
              with:
                  command: aer test sfdx --default-namespace OpenSF
              env:
                  AER_LICENSE_KEY: ${{ secrets.AER_LICENSE_KEY }}
