name: Security Scan

on:
    pull_request:
        branches: [master]

# pull-requests: write — PR comments
permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    code-analyzer:
        name: Salesforce Code Analyzer
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Salesforce CLI
              run: npm install -g @salesforce/cli

            - name: Install Code Analyzer v5
              run: sf plugins install @salesforce/plugin-code-analyzer

            - name: Run Code Analyzer
              id: scan
              run: |
                  mkdir -p scan-results
                  sf code-analyzer run \
                    --workspace "force-app" \
                    --output-file scan-results/code-analyzer-results.json \
                    --severity-threshold 2 2>&1 | tee scan-output.txt
              continue-on-error: true

            - name: Upload Code Analyzer Report
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: code-analyzer-report
                  path: scan-results/
                  retention-days: 30

            - name: Fail if Code Analyzer found violations
              if: always()
              run: |
                  if [ "${{ steps.scan.outcome }}" != "success" ]; then
                    echo "::error::Salesforce Code Analyzer reported violations at or above the severity threshold. See the uploaded report."
                    exit 1
                  fi

    js-vulnerability-scan:
        name: JS Vulnerability Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # All npm dependencies are dev-only (the package ships no npm
            # runtime code), so audit the full dev tree at high severity.
            - name: Audit npm dependencies
              id: audit
              run: npm audit --audit-level=high 2>&1 | tee audit-output.txt
              continue-on-error: true

            - name: Build comment
              if: always()
              run: |
                  AUDIT_OUTCOME="${{ steps.audit.outcome }}"
                  if [ "$AUDIT_OUTCOME" = "success" ]; then
                    ICON="✅"
                  else
                    ICON="⚠️"
                  fi

                  cat > security-comment.md << MDEOF
                  ## ${ICON} Security Scan Results

                  ### npm Audit
                  \`\`\`
                  $(tail -20 audit-output.txt 2>/dev/null || echo "No output")
                  \`\`\`

                  ---
                  *Security Scan • $(date -u +%Y-%m-%dT%H:%M:%SZ)*
                  MDEOF

            # Comment step never gates the run: skipped for fork PRs (read-only
            # token would 403) and tolerates API failures.
            - name: Comment on PR
              if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const body = fs.readFileSync('security-comment.md', 'utf8');
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number
                      });
                      const existing = comments.find(c =>
                        c.user.type === 'Bot' && c.body.includes('Security Scan Results')
                      );
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body
                        });
                      }

            - name: Fail if npm audit found high-severity vulnerabilities
              if: always()
              run: |
                  if [ "${{ steps.audit.outcome }}" != "success" ]; then
                    echo "::error::npm audit reported high-severity vulnerabilities. See audit output above."
                    exit 1
                  fi
