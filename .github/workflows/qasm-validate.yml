name: OpenQASM Circuit Validation

on:
    push:
        branches: ['**']
        paths:
            - 'force-app/main/default/classes/CircuitBuilder*'
            - 'force-app/main/default/classes/IBMQuantumProvider*'
            - '.github/workflows/qasm-validate.yml'
    pull_request:
        branches: [master]

# contents: write — commit comments on push; pull-requests: write — PR comments
permissions:
    contents: write
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate-circuits:
        name: Validate OpenQASM Circuits
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.11'

            - name: Install Qiskit
              run: pip install qiskit qiskit-ibm-runtime qiskit-qasm3-import

            - name: Extract and validate QASM circuits
              id: validate
              run: |
                  python3 << 'PYEOF' 2>&1 | tee qasm-output.txt
                  """
                  Extract OpenQASM 3.0 circuits from Apex source code and validate them
                  using Qiskit's QASM parser. This catches syntax errors, invalid gate names,
                  and structural issues before they reach IBM Quantum hardware.
                  """
                  import re
                  import sys
                  import os

                  # Try importing Qiskit QASM tools
                  try:
                      from qiskit.qasm3 import loads as qasm3_loads
                      HAS_QASM3 = True
                  except ImportError:
                      HAS_QASM3 = False

                  try:
                      from qiskit import QuantumCircuit
                      HAS_QISKIT = True
                  except ImportError:
                      HAS_QISKIT = False

                  def extract_qasm_from_apex(filepath):
                      """Extract OpenQASM string literals from Apex source."""
                      circuits = []
                      with open(filepath) as f:
                          content = f.read()

                      # Find multi-line string concatenations that build QASM
                      # Pattern: strings containing 'OPENQASM' or 'include "stdgates.inc"'
                      # Apex builds QASM via string concatenation: 'OPENQASM 3.0;\\n' + ...

                      # Extract complete QASM strings by finding builder methods
                      # Look for method return values that contain QASM headers
                      qasm_pattern = r"'OPENQASM\s+3\.0"
                      if re.search(qasm_pattern, content):
                          # This file builds QASM circuits
                          # Extract the gate operations used
                          gates_used = set()
                          gate_pattern = r"'(h|x|y|z|cx|cz|sx|s|t|rz|ry|rx|measure|barrier|reset)\s"
                          for match in re.finditer(gate_pattern, content, re.IGNORECASE):
                              gates_used.add(match.group(1).lower())

                          circuits.append({
                              'file': filepath,
                              'gates': gates_used,
                              'has_header': True
                          })

                      return circuits

                  def validate_qasm_structure(filepath):
                      """Validate QASM circuit structure from Apex builder."""
                      issues = []
                      with open(filepath) as f:
                          content = f.read()

                      # Check 1: QASM version declaration
                      if "'OPENQASM 3.0" in content:
                          print(f"  ✓ Uses OpenQASM 3.0 header")
                      elif "'OPENQASM 2.0" in content:
                          issues.append("Uses deprecated OpenQASM 2.0")

                      # Check 2: stdgates.inc inclusion
                      if "'include" in content and "stdgates.inc" in content:
                          print(f"  ✓ Includes stdgates.inc")
                      elif "'OPENQASM" in content:
                          issues.append("Missing stdgates.inc include")

                      # Check 3: Qubit declaration
                      if "qubit[" in content or "'qubit'" in content:
                          print(f"  ✓ Has qubit declarations")

                      # Check 4: Measurement operations
                      if "'measure'" in content or "'c[" in content:
                          print(f"  ✓ Has measurement operations")

                      # Check 5: No deprecated QASM 2.0 syntax
                      deprecated = ['IBMQASM', 'qreg', 'creg']
                      for dep in deprecated:
                          if f"'{dep}" in content:
                              issues.append(f"Uses deprecated QASM 2.0 syntax: {dep}")

                      # Check 6: Gate validity (ISA compliance for IBM Heron)
                      valid_isa_gates = {
                          'h', 'x', 'y', 'z', 'cx', 'cz', 'sx', 's', 't',
                          'rz', 'ry', 'rx', 'id', 'sdg', 'tdg', 'ecr',
                          'measure', 'barrier', 'reset', 'delay'
                      }
                      gate_refs = re.findall(r"'([\w]+)\s*(?:qubit|q\[)", content)
                      unknown_gates = set()
                      for g in gate_refs:
                          if g.lower() not in valid_isa_gates and g.lower() not in {'bit', 'include', 'openqasm'}:
                              unknown_gates.add(g)

                      if unknown_gates:
                          issues.append(f"Non-ISA gates found: {unknown_gates}")
                      else:
                          print(f"  ✓ All gates are ISA-compliant")

                      # Check 7: Qubit index bounds (no hardcoded > 156 for Heron)
                      qubit_indices = [int(m) for m in re.findall(r'q\[(\d+)\]', content)]
                      if qubit_indices:
                          max_idx = max(qubit_indices)
                          if max_idx > 156:
                              issues.append(f"Qubit index {max_idx} exceeds Heron r2 max (156)")
                          else:
                              print(f"  ✓ Qubit indices within bounds (max: {max_idx})")

                      return issues

                  def build_sample_qasm():
                      """Build sample QASM circuits that the Apex builder would produce."""
                      circuits = {
                          "4-qubit QRNG": """OPENQASM 3.0;
                  include "stdgates.inc";
                  qubit[4] q;
                  bit[4] c;
                  h q[0];
                  h q[1];
                  h q[2];
                  h q[3];
                  c[0] = measure q[0];
                  c[1] = measure q[1];
                  c[2] = measure q[2];
                  c[3] = measure q[3];""",
                          "Bell Test (1 pair)": """OPENQASM 3.0;
                  include "stdgates.inc";
                  qubit[2] q;
                  bit[2] c;
                  h q[0];
                  cx q[0], q[1];
                  c[0] = measure q[0];
                  c[1] = measure q[1];""",
                          "CHSH Circuit": """OPENQASM 3.0;
                  include "stdgates.inc";
                  qubit[4] q;
                  bit[4] c;
                  h q[0];
                  cx q[0], q[1];
                  h q[2];
                  cx q[2], q[3];
                  rz(0.7853981633974483) q[0];
                  rz(0.3926990816987242) q[2];
                  h q[0];
                  h q[2];
                  c[0] = measure q[0];
                  c[1] = measure q[1];
                  c[2] = measure q[2];
                  c[3] = measure q[3];"""
                      }
                      return circuits

                  # Main validation
                  print("=" * 60)
                  print("OpenQASM Circuit Validation Report")
                  print("=" * 60)

                  apex_files = [
                      'force-app/main/default/classes/CircuitBuilder.cls',
                      'force-app/main/default/classes/IBMQuantumProvider.cls'
                  ]

                  total_issues = []

                  for filepath in apex_files:
                      if not os.path.exists(filepath):
                          # A missing file means the validation list is stale —
                          # that must fail the run, not silently skip checks.
                          print(f"\n✗ File not found: {filepath}")
                          total_issues.append(f"File not found: {filepath}")
                          continue

                      print(f"\n── {os.path.basename(filepath)} ──")
                      issues = validate_qasm_structure(filepath)
                      if issues:
                          for issue in issues:
                              print(f"  ✗ {issue}")
                          total_issues.extend(issues)
                      else:
                          print(f"  ✓ All structural checks passed")

                  # Validate sample circuits with Qiskit
                  print(f"\n── Qiskit QASM 3.0 Parse Validation ──")
                  sample_circuits = build_sample_qasm()

                  for name, qasm in sample_circuits.items():
                      try:
                          if HAS_QASM3:
                              circuit = qasm3_loads(qasm)
                              print(f"  ✓ {name}: Valid ({circuit.num_qubits} qubits, {circuit.size()} gates)")
                          else:
                              # Fallback: basic syntax check
                              assert 'OPENQASM 3.0' in qasm
                              assert 'include "stdgates.inc"' in qasm
                              assert 'qubit[' in qasm
                              assert 'measure' in qasm
                              print(f"  ✓ {name}: Syntax check passed (Qiskit QASM3 not available)")
                      except Exception as e:
                          print(f"  ✗ {name}: INVALID - {e}")
                          total_issues.append(f"{name}: {e}")

                  print(f"\n{'=' * 60}")
                  if total_issues:
                      print(f"FAILED: {len(total_issues)} issue(s) found")
                      for issue in total_issues:
                          print(f"  - {issue}")
                      sys.exit(1)
                  else:
                      print("PASSED: All OpenQASM circuits are valid")
                      sys.exit(0)
                  PYEOF
              continue-on-error: true

            - name: Build comment body
              if: always()
              run: |
                  OUTCOME="${{ steps.validate.outcome }}"
                  if [ "$OUTCOME" = "success" ]; then
                    ICON="✅"
                  else
                    ICON="❌"
                  fi

                  cat > qasm-comment.md << MDEOF
                  ## ${ICON} OpenQASM Circuit Validation

                  \`\`\`
                  $(cat qasm-output.txt 2>/dev/null || echo "No output captured")
                  \`\`\`

                  ---
                  *OpenQASM Validation • $(date -u +%Y-%m-%dT%H:%M:%SZ)*
                  MDEOF

            # Comment steps never gate the run: they are skipped for fork PRs
            # (read-only token would 403) and tolerate API failures. The
            # "Fail if validation failed" step below is the real gate.
            - name: Comment on PR
              if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const body = fs.readFileSync('qasm-comment.md', 'utf8');
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number
                      });
                      const existing = comments.find(c =>
                        c.user.type === 'Bot' && c.body.includes('OpenQASM Circuit Validation')
                      );
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body
                        });
                      }

            - name: Comment on commit
              if: always() && github.event_name == 'push'
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const body = fs.readFileSync('qasm-comment.md', 'utf8');
                      await github.rest.repos.createCommitComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        commit_sha: context.sha,
                        body
                      });

            - name: Fail if validation failed
              if: always()
              run: |
                  if [ "${{ steps.validate.outcome }}" != "success" ]; then
                    echo "::error::OpenQASM validation failed. See comment for details."
                    exit 1
                  fi
